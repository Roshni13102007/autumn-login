<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autumn Vibes Login</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ===== GLOBAL STYLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f9a826, #fdd9a0, #f08a5d);
      overflow: hidden;
      transition: background 0.4s ease;
    }

    /* ===== STATIC AUTUMN LEAVES BACKGROUND ===== */
    .leaves-bg {
      position: absolute;
      inset: 0;
      background-image:
        url('https://images.unsplash.com/photo-1501973801540-537f08ccae7b'),
        linear-gradient(135deg, #f9a826, #fdd9a0, #f08a5d);
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      z-index: -1;
    }

    /* Big decorative leaves */
    .big-leaf {
      position: absolute;
      font-size: 80px;
      opacity: 0.25;
      filter: blur(0.5px);
    }

    .leaf-1 { top: 10%; left: 5%; }
    .leaf-2 { top: 60%; left: 10%; }
    .leaf-3 { top: 20%; right: 8%; }
    .leaf-4 { bottom: 10%; right: 15%; }
      100% {
        transform: translateY(120vh) rotate(360deg);
      }
    }

    body.dark {
      background: linear-gradient(135deg, #2b1d0e, #4a2c1a, #1e130c);
    }

    /* ===== LOGIN CARD ===== */
    .login-container {
      width: 360px;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      animation: fadeIn 0.8s ease;
    }

    body.dark .login-container {
      background: rgba(0, 0, 0, 0.35);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      color: #8a3b12;
    }

    body.dark h1 {
      color: #ffb703;
    }

    p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #7a4a2e;
      margin-bottom: 25px;
    }

    body.dark p.subtitle {
      color: #e0c097;
    }

    /* ===== INPUTS ===== */
    .input-box {
      position: relative;
      margin-bottom: 18px;
    }

    .input-box i {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #a65b2e;
    }

    .input-box input {
      width: 100%;
      padding: 12px 12px 12px 38px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.65);
      font-size: 14px;
    }

    body.dark .input-box input {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .error {
      font-size: 12px;
      color: #b00020;
      margin-top: 4px;
    }

    /* ===== BUTTON ===== */
    .login-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: #e36414;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .login-btn:hover {
      background: #c8550f;
      transform: translateY(-2px);
    }

    /* ===== EXTRA ===== */
    .signup-text {
      text-align: center;
      font-size: 13px;
      margin-top: 18px;
      color: #7a4a2e;
    }

    body.dark .signup-text {
      color: #e0c097;
    }

    .toggle {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      cursor: pointer;
      color: #8a3b12;
    }

    body.dark .toggle {
      color: #ffb703;
    }
  </style>
</head>
<body>

  <!-- Static background layer -->
  <div class="leaves-bg"></div>

  <!-- Big decorative leaves -->
  <div class="big-leaf leaf-1">🍁</div>
  <div class="big-leaf leaf-2">🍂</div>
  <div class="big-leaf leaf-3">🍁</div>
  <div class="big-leaf leaf-4">🍂</div>

  <div class="login-container">
    <h1>🍂 Autumn Vibes</h1>
    <p class="subtitle">Warm • Cozy • Modern</p>

    <div class="input-box">
      <i class="fa-solid fa-envelope"></i>
      <input type="email" id="email" placeholder="Email">
      <div class="error" id="emailError"></div>
    </div>

    <div class="input-box">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="password" placeholder="Password">
      <div class="error" id="passError"></div>
    </div>

    <button class="login-btn" onclick="validate()">Login</button>

    <div class="signup-text">
      Don’t have an account? <strong>Sign up</strong>
    </div>

    <div class="toggle" onclick="toggleTheme()">
      🌙 Toggle Dark Autumn Mode
    </div>
  </div>

  <script>
    function validate() {
      let email = document.getElementById('email').value;
      let password = document.getElementById('password').value;
      let emailError = document.getElementById('emailError');
      let passError = document.getElementById('passError');

      emailError.textContent = "";
      passError.textContent = "";

      let valid = true;

      if (email === "") {
        emailError.textContent = "Email is required";
        valid = false;
      } else if (!email.includes("@")) {
        emailError.textContent = "Enter a valid email";
        valid = false;
      }

      if (password === "") {
        passError.textContent = "Password is required";
        valid = false;
      } else if (password.length < 6) {
        passError.textContent = "Minimum 6 characters required";
        valid = false;
      }

      if (valid) {
        alert("Login Successful 🍁");
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }
  </script>
</body>
</html>
